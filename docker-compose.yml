services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marks}
      POSTGRES_DB: ${POSTGRES_DB:-marks}
    # Bind only on localhost by default — override with POSTGRES_PUBLISH=0.0.0.0:5432 if needed.
    ports:
      - "${POSTGRES_PUBLISH:-127.0.0.1:5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - blobdata:/var/lib/sma-blobs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-marks}:${POSTGRES_PASSWORD:-marks}@db:5432/${POSTGRES_DB:-marks}?schema=public
      # Required: docker compose fails API boot if this stays at the placeholder.
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a strong random value (≥32 chars recommended)}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      ALLOW_PUBLIC_SCHOOL_REGISTRATION: ${ALLOW_PUBLIC_SCHOOL_REGISTRATION:-false}
      ENABLE_BACKGROUND_JOBS: ${ENABLE_BACKGROUND_JOBS:-true}
      BLOB_STORAGE: ${BLOB_STORAGE:-database}
      BLOB_STORAGE_PATH: ${BLOB_STORAGE_PATH:-/var/lib/sma-blobs}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-15m}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PORT: "4000"
      NODE_ENV: production
      CRON_SECRET: ${CRON_SECRET:-}
    volumes:
      - blobdata:/var/lib/sma-blobs
    ports:
      - "4000:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s

  web:
    build:
      context: ./client
      args:
        VITE_API_BASE: ""
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

  # Full pg_dump on a schedule. The volume is a complete copy of pupil data;
  # it is not published. Managed Postgres should use provider PITR instead.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-marks}:${POSTGRES_PASSWORD:-marks}@db:5432/${POSTGRES_DB:-marks}
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./scripts/pg-dump-backup.sh:/opt/sma/pg-dump-backup.sh:ro
      - backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        interval="$${BACKUP_INTERVAL_SECONDS:-86400}"
        case "$$interval" in
          ''|*[!0-9]*) echo "BACKUP_INTERVAL_SECONDS must be an integer >= 60" >&2; exit 1 ;;
        esac
        if [ "$$interval" -lt 60 ]; then
          echo "BACKUP_INTERVAL_SECONDS must be >= 60" >&2
          exit 1
        fi
        echo "Scheduled pg_dump every $${interval}s into /backups (keep $${BACKUP_KEEP:-0})"
        while true; do
          if ! /bin/sh /opt/sma/pg-dump-backup.sh; then
            echo "pg_dump failed; retrying in $${interval}s" >&2
          fi
          sleep "$$interval"
        done

  # One-shot restore rehearsal into a scratch database. Not started by default.
  # docker compose --profile rehearse run --rm backup-rehearse
  backup-rehearse:
    image: postgres:16-alpine
    profiles: ["rehearse"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-marks}:${POSTGRES_PASSWORD:-marks}@db:5432/${POSTGRES_DB:-marks}
      RESTORE_CHECK_DB: ${RESTORE_CHECK_DB:-marks_restore_check}
    volumes:
      - ./scripts/pg-dump-restore-check.sh:/opt/sma/pg-dump-restore-check.sh:ro
    entrypoint: ["/bin/sh", "/opt/sma/pg-dump-restore-check.sh"]

volumes:
  pgdata:
  blobdata:
  backups:
