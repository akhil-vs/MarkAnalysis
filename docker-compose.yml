services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marks}
      POSTGRES_DB: ${POSTGRES_DB:-marks}
    # Bind only on localhost by default — override with POSTGRES_PUBLISH=0.0.0.0:5432 if needed.
    ports:
      - "${POSTGRES_PUBLISH:-127.0.0.1:5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - blobdata:/var/lib/sma-blobs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-marks}:${POSTGRES_PASSWORD:-marks}@db:5432/${POSTGRES_DB:-marks}?schema=public
      # Required: docker compose fails API boot if this stays at the placeholder.
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a strong random value (≥32 chars recommended)}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      ALLOW_PUBLIC_SCHOOL_REGISTRATION: ${ALLOW_PUBLIC_SCHOOL_REGISTRATION:-false}
      ENABLE_BACKGROUND_JOBS: ${ENABLE_BACKGROUND_JOBS:-true}
      BLOB_STORAGE: ${BLOB_STORAGE:-database}
      BLOB_STORAGE_PATH: ${BLOB_STORAGE_PATH:-/var/lib/sma-blobs}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-15m}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PORT: "4000"
      NODE_ENV: production
    volumes:
      - blobdata:/var/lib/sma-blobs
    ports:
      - "4000:4000"

  web:
    build:
      context: ./client
      args:
        VITE_API_BASE: ""
        VITE_ENABLE_DEMO_LOGIN: ${VITE_ENABLE_DEMO_LOGIN:-false}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
  blobdata:
